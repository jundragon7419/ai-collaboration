name: 작업 (메인테이너)
description: 메인테이너가 계획한 작업을 정해진 형식으로 올립니다. 버그 제보와 기능 제안은 다른 양식을 써 주세요.
title: '[작업] '
labels: ['task']
body:
  - type: markdown
    attributes:
      value: |
        이슈 하나가 PR 하나 크기가 되도록 나눠 주세요. 제목은 `[작업] <한 줄 요약>` 형식이고, 제목에 이모지는 쓰지 않습니다. 예: `[작업] provider registry와 모델 목록 추가`

  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 기능
        - 버그 수정
        - 리팩터링
        - 테스트
        - 확인 실험
        - 문서
        - 설정, 도구, CI
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - 설정과 provider registry
        - provider adapter (claude, codex)
        - pipeline (단계, 수정 회차, 판정)
        - 작업 공간과 변경 감사
        - prepare와 check
        - git과 공개 (commit, push, PR)
        - CLI (setup, doctor, run)
        - 문서
        - CI
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: 구현을 맡길 모델
      description: 판단이 많은 작업은 Fable이나 Opus, 정해진 대로 만드는 작업은 Sonnet을 권장합니다.
      options:
        - Fable
        - Opus
        - Sonnet
        - Codex
        - 사람
        - 미정
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 이 작업이 필요한지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 작업 단위로 체크리스트를 적어 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 리뷰어가 이 조건으로 완료 여부를 판단합니다. 확인할 수 있는 형태로 적어 주세요.
      placeholder: |
        - config.toml에 없는 provider를 참조하면 validate가 오류를 반환하는 테스트 통과
        - `uv run aicollab config validate`가 예시 설정에서 종료 코드 0
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 참고 문서
      description: 기획 문서의 절, 결정 기록, 공식 CLI 문서 링크 등. 구현자가 읽어야 할 위치를 정확히 적어 주세요.
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: 선행 이슈
      description: 이 작업 전에 끝나야 하는 이슈가 있으면 적어 주세요.
      placeholder: '#2, #5'

  - type: textarea
    id: out-of-scope
    attributes:
      label: 이번에 하지 않는 것
      description: 범위가 커지지 않도록, 관련 있지만 이 이슈에서 다루지 않을 내용을 적어 주세요.

  - type: checkboxes
    id: flags
    attributes:
      label: 해당 사항
      options:
        - label: 실제 Claude Code나 Codex CLI 호출이 필요합니다. (사용량 소비)
        - label: Windows에서 직접 확인해야 합니다.
        - label: 설정 파일 형식이나 역할 사이 데이터 형식이 바뀝니다. (문서 갱신 필요)
