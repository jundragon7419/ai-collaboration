[project]
name = "aicollab"
version = "0.1.0"
description = "여러 AI 모델에 역할을 배정하고 공식 CLI를 호출해 협업 흐름을 실행하는 로컬 CLI 도구"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
aicollab = "aicollab.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicollab"]

[tool.ruff]
line-length = 100
target-version = "py312"
# M0 확인 실험 스크립트는 결과의 근거라 고치지 않는다.
extend-exclude = ["scripts/probes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
